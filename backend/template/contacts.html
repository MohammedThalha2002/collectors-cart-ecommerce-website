<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>New “Sell to Us” Submission</title>
  <style>
    body { margin:0; padding:20px; font-family:Arial, sans-serif; background:#f5f5f5; }
    .wrapper { max-width:650px; margin:auto; background:#fff; border:1px solid #ddd; border-radius:8px; overflow:hidden; }
    .header { background:#111; color:#fff; padding:20px 30px; }
    .header h1 { margin:0; font-size:22px; }
    .content { padding:25px 30px; line-height:1.6; color:#333; }
    .row { display:flex; justify-content:space-between; margin:8px 0; }
    .label { font-weight:bold; min-width:140px; }
    .message-box { background:#fafafa; border:1px solid #e5e5e5; border-radius:4px; padding:15px; margin-top:10px; white-space:pre-wrap; }
    .footer { background:#f3f3f3; padding:15px 30px; font-size:12px; color:#666; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>New {{title}} Submission</h1>
    </div>

    <div class="content">
      <p>A visitor has submitted the {{title}} form on the website. Details are below:</p>

      <div class="row">
        <span class="label">Full Name:</span>
        <span>{{fullName}}</span>
      </div>

      <div class="row">
        <span class="label">Email:</span>
        <span>{{email}}</span>
      </div>

      <div class="row">
        <span class="label">Phone:</span>
        <span>{{phone}}</span>
      </div>

      <div class="row">
        <span class="label">Subject:</span>
        <span>{{subject}}</span>
      </div>

      <div class="label">Message:</div>
      <div class="message-box">{{message}}</div>
    </div>

    <div class="footer">
      Sent automatically from your website.
    </div>
  </div>
</body>
</html>
